<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard réseau — Optical Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --dark: #0D0D0D;
    --red: #CC1719;
    --cream: #F0EDE6;
    --green: #2E7D32;
    --green-bg: #E6F4E6;
    --orange: #B8710A;
    --orange-bg: #FCEFD9;
    --gray: #6b6b68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Barlow', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--dark);
  }
  header.topbar {
    background: var(--dark);
    color: var(--cream);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.topbar h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header.topbar button {
    background: transparent;
    border: 1px solid #555;
    color: var(--cream);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---- Login ---- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dark);
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 28px;
    width: 320px;
    max-width: 90vw;
  }
  .login-card h2 { margin: 0 0 4px; font-size: 19px; }
  .login-card p.sub { color: var(--gray); font-size: 13px; margin: 0 0 20px; }
  .login-card label { display: block; font-size: 13px; margin: 14px 0 5px; font-weight: 500; }
  .login-card input {
    width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-family: inherit; font-size: 14px;
  }
  .login-card button.submit {
    width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 6px;
    background: var(--red); color: #fff; font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ---- Filtres ---- */
  .filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filters select, .filters input {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }

  /* ---- KPI ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 14px 16px; }
  .kpi-card .lbl { font-size: 12px; color: var(--gray); margin: 0 0 4px; }
  .kpi-card .val { font-size: 22px; font-weight: 700; margin: 0; }

  /* ---- Table ---- */
  table.dash-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  table.dash-table th {
    text-align: left; font-size: 12px; color: var(--gray); font-weight: 600;
    padding: 10px 12px; border-bottom: 1px solid #e5e2d9;
  }
  table.dash-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0efe9; }
  table.dash-table tr.row-clickable { cursor: pointer; }
  table.dash-table tr.row-clickable:hover { background: #faf9f5; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-vert { background: var(--green-bg); color: var(--green); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-rouge { background: #FBE4E4; color: var(--red); }
  .badge-neutre { background: #eee; color: var(--gray); }

  /* ---- Detail ---- */
  .back-btn {
    background: none; border: none; color: var(--red); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 14px;
  }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .detail-header h2 { margin: 0 0 2px; font-size: 21px; }
  .detail-header .sub { color: var(--gray); font-size: 13px; }
  .pos-row { display: flex; gap: 10px; margin: 12px 0 20px; flex-wrap: wrap; }
  .pos-chip { background: #fff; border-radius: 8px; padding: 7px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .pos-chip .v { font-weight: 700; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); margin: 22px 0 8px; }
  .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; }
  .sub-card {
    background: #fff; border: none; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer;
    font-family: inherit;
  }
  .sub-card .lbl { font-size: 11px; color: var(--gray); margin: 0 0 4px; }
  .sub-card .val { font-size: 17px; font-weight: 700; margin: 0; }

  .chart-box { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 6px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; }
  .item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0efe9; }
  .item-row:last-child { border-bottom: none; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-box { background: #fff; border-radius: 10px; padding: 18px; width: 420px; max-width: 100%; }
  .modal-box h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 480px) {
    main { padding: 14px 10px 50px; }
    header.topbar { padding: 12px 14px; }
    header.topbar h1 { font-size: 15px; }
    .detail-header h2 { font-size: 18px; }
    .card, .kpi-card, .chart-box { padding: 12px; }
  }

  .loading { text-align: center; padding: 40px; color: var(--gray); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>Dashboard réseau</h2>
    <p class="sub">Connexion avec ton identifiant Zimbra</p>
    <label for="login-user">Identifiant</label>
    <input type="text" id="login-user" placeholder="prenom.nom@optical-center.com" autocomplete="username">
    <label for="login-pass">Mot de passe</label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <button class="submit" onclick="doLogin()">Se connecter</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<div id="app-screen" style="display:none">
  <header class="topbar">
    <h1>Dashboard réseau</h1>
    <button onclick="logout()">Déconnexion</button>
  </header>
  <main>
    <div id="view-network"></div>
    <div id="view-detail" style="display:none"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3 id="modal-title"></h3>
    <div class="chart-box" style="padding:0"><canvas id="modal-chart" height="180"></canvas></div>
  </div>
</div>

<script>
const RELAY = 'https://zimbra-relay.oli-baroukh.workers.dev';
const STORE_TOKEN = 'OC-bilan-store-2026';

const SUB_LABELS = {
  actions: 'Actions', effectif: 'Effectif', absenteisme: 'Absentéisme', positionnement: 'Positionnement',
  pedlv: 'Pedlv', avis: 'Avis', equipe: 'Équipe', kaizen: 'Kaizen',
};

let session = null;
let allResults = [];
let networkTrend = [];
let networkChart = null;
let detailChart = null;
let currentDetailHistory = [];
let modalChartInstance = null;

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem('bilan_ar_session') || 'null');
    if (s && s.exp > Date.now()) { session = s; return s; }
  } catch(e) {}
  session = null;
  return null;
}

function logout() {
  localStorage.removeItem('bilan_ar_session');
  session = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function doLogin() {
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const zimbraUser = document.getElementById('login-user').value.trim();
  const zimbraPass = document.getElementById('login-pass').value;
  if (!zimbraUser || !zimbraPass) {
    errEl.textContent = 'Identifiant et mot de passe requis';
    errEl.style.display = 'block';
    return;
  }
  try {
    const resp = await fetch(RELAY + '/ar-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Store-Token': STORE_TOKEN },
      body: JSON.stringify({ zimbraUser, zimbraPass }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || ('Erreur ' + resp.status));
    session = { token: data.sessionToken, ar: data.ar, exp: Date.now() + data.expiresInMs };
    localStorage.setItem('bilan_ar_session', JSON.stringify(session));
    startApp();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function authHeaders() {
  return { 'X-Store-Token': STORE_TOKEN, 'X-AR-Session': session ? session.token : '' };
}

function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  showNetworkView();
}

function scoreClass(score) {
  if (score === null || score === undefined) return 'badge-neutre';
  if (score >= 80) return 'badge-vert';
  if (score >= 60) return 'badge-orange';
  return 'badge-rouge';
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR');
}

// ---------------------------------------------------------------- Vue réseau
async function showNetworkView() {
  document.getElementById('view-detail').style.display = 'none';
  const el = document.getElementById('view-network');
  el.style.display = 'block';
  el.innerHTML = '<div class="loading">Chargement…</div>';
  try {
    const resp = await fetch(RELAY + '/store-health', { headers: authHeaders() });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Erreur de chargement');
    allResults = data.results || [];
    networkTrend = data.networkTrend || [];
    renderNetworkView();
  } catch(e) {
    el.innerHTML = '<div class="loading">Erreur : ' + e.message + '</div>';
  }
}

function renderNetworkView() {
  const el = document.getElementById('view-network');
  const ars = [...new Set(allResults.map(r => r.animateur).filter(Boolean))].sort();

  el.innerHTML = `
    <div class="filters">
      <select id="ar-filter" onchange="renderTable()">
        <option value="">Tous les animateurs</option>
        ${ars.map(a => '<option value="' + a + '">' + a + '</option>').join('')}
      </select>
      <input type="text" id="search-input" placeholder="Rechercher un magasin" oninput="renderTable()">
    </div>
    <div class="kpi-row" id="kpi-row"></div>
    <div class="chart-box"><canvas id="network-chart" height="90"></canvas></div>
    <div class="table-wrap">
    <table class="dash-table">
      <thead><tr>
        <th>Magasin</th><th>Animateur</th><th>Santé</th><th>Kaizen</th><th>Actions</th><th>Dernière visite</th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    </div>
  `;

  renderKpis();
  renderNetworkChart();
  renderTable();
}

function renderKpis() {
  const vert = allResults.filter(r => r.score !== null && r.score >= 80).length;
  const orange = allResults.filter(r => r.score !== null && r.score >= 60 && r.score < 80).length;
  const rouge = allResults.filter(r => r.score !== null && r.score < 60).length;
  const sansDonnees = allResults.filter(r => r.score === null).length;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card"><p class="lbl">Magasins au vert</p><p class="val" style="color:var(--green)">${vert}</p></div>
    <div class="kpi-card"><p class="lbl">À surveiller</p><p class="val" style="color:var(--orange)">${orange}</p></div>
    <div class="kpi-card"><p class="lbl">En alerte</p><p class="val" style="color:var(--red)">${rouge}</p></div>
    <div class="kpi-card"><p class="lbl">Sans données</p><p class="val">${sansDonnees}</p></div>
  `;
}

function renderNetworkChart() {
  if (networkChart) { networkChart.destroy(); networkChart = null; }
  const ctx = document.getElementById('network-chart');
  if (!networkTrend.length) {
    ctx.parentElement.innerHTML = '<p style="color:var(--gray);font-size:13px;margin:0">Pas encore assez d\'historique pour une courbe de tendance.</p>';
    return;
  }
  networkChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: networkTrend.map(p => fmtDate(p.periode)),
      datasets: [{ data: networkTrend.map(p => p.score), borderColor: '#CC1719', backgroundColor: 'rgba(204,23,25,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 }, x: { grid: { display: false } } },
    },
  });
}

function renderTable() {
  const arFilter = document.getElementById('ar-filter').value;
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  let rows = allResults;
  if (arFilter) rows = rows.filter(r => r.animateur === arFilter);
  if (search) rows = rows.filter(r => r.libelle.toLowerCase().includes(search));
  rows = rows.slice().sort((a, b) => (a.score ?? 999) - (b.score ?? 999));

  document.getElementById('table-body').innerHTML = rows.map(r => `
    <tr class="row-clickable" onclick="showDetailView('${r.code}')">
      <td>${r.libelle}</td>
      <td style="color:var(--gray)">${r.animateur || '—'}</td>
      <td><span class="badge ${scoreClass(r.score)}">${r.score !== null ? r.score : '—'}</span></td>
      <td style="color:var(--gray)">${r.kaizenDernierScoreCloture !== null && r.kaizenDernierScoreMax ? r.kaizenDernierScoreCloture + '/' + r.kaizenDernierScoreMax : '—'}</td>
      <td style="${r.actionsNonSoldees && r.actionsNonSoldees.count > 0 ? 'color:var(--red)' : 'color:var(--gray)'}">${r.actionsNonSoldees ? r.actionsNonSoldees.count : 0}</td>
      <td style="color:var(--gray)">${r.daysSinceVisit !== null ? r.daysSinceVisit + ' j.' : 'jamais'}</td>
    </tr>
  `).join('');
}

// ---------------------------------------------------------------- Vue détail
async function showDetailView(code) {
  document.getElementById('view-network').style.display = 'none';
  const el = document.getElementById('view-detail');
  el.style.display = 'block';
  el.innerHTML = '<div class="loading">Chargement…</div>';
  try {
    const resp = await fetch(RELAY + '/store-health-detail?magasin_code=' + encodeURIComponent(code), { headers: authHeaders() });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Erreur de chargement');
    renderDetailView(data);
  } catch(e) {
    el.innerHTML = '<button class="back-btn" onclick="showNetworkView()">&larr; Retour</button><div class="loading">Erreur : ' + e.message + '</div>';
  }
}

function renderDetailView(d) {
  const el = document.getElementById('view-detail');
  const sub = d.subScores || {};

  const actionsHtml = (d.actionsNonSoldees && d.actionsNonSoldees.items && d.actionsNonSoldees.items.filter(a => a.fromPrevious).length)
    ? d.actionsNonSoldees.items.filter(a => a.fromPrevious).map(a =>
        '<div class="item-row"><span>' + a.text + '</span><span style="color:var(--red)">' + (a.repriseCount + 1) + ' visites</span></div>'
      ).join('')
    : '<p style="color:var(--gray);font-size:13px;margin:0">Aucune action non soldée.</p>';

  const kaizenHtml = (d.kaizenPointsNonResolus && d.kaizenPointsNonResolus.length)
    ? d.kaizenPointsNonResolus.map(k =>
        '<div class="item-row"><span>' + k.label + (k.zoneNom ? ' — ' + k.zoneNom : '') + '</span><span style="color:var(--red)">' + k.moisConsecutifs + ' mois</span></div>'
      ).join('')
    : '<p style="color:var(--gray);font-size:13px;margin:0">Aucun point non résolu.</p>';
  const cumulHtml = d.kaizenCumulAnnuel !== null && d.kaizenCumulAnnuel !== undefined
    ? '<p style="font-size:12px;color:var(--gray);margin:10px 0 0">Cumul annuel : ' + d.kaizenCumulAnnuel + '/400</p>' : '';

  const pedlvRows = (d.pedlvIndicateurs || []).map(i => {
    const valeurAffichee = i.cle === 'tva' && i.valeur !== null && i.valeur !== undefined ? Math.round(i.valeur) : (i.valeur ?? '—');
    return `
    <tr>
      <td style="font-weight:600">${i.cle}</td>
      <td style="text-align:right">${valeurAffichee}</td>
      <td style="text-align:right;color:var(--gray)">${i.objectif ?? '—'}</td>
      <td style="text-align:right"><span class="badge badge-${i.statut}">${i.statut}${i.semainesRouge ? ' · ' + i.semainesRouge + ' sem.' : ''}</span></td>
    </tr>`;
  }).join('');

  const equipeRows = (d.equipeTaches || []).map(t => {
    let moyenneHtml = '—';
    if (t.moyenne !== null && t.moyenne !== undefined) {
      const color = t.moyenne >= 8 ? 'var(--green)' : (t.moyenne < 7 ? 'var(--red)' : 'var(--orange)');
      moyenneHtml = '<span style="color:' + color + ';font-weight:700">' + t.moyenne + '</span>';
    }
    return `
    <tr>
      <td>${t.tache}</td>
      <td>${t.responsable || '<span style="color:var(--red)">non assigné</span>'}</td>
      <td style="text-align:right">${moyenneHtml}</td>
    </tr>`;
  }).join('');

  const eff = d.effectif || {};
  const effRH = d.effectifRH || {};
  let effHtml = 'Pas de donnée effectif RH';
  if (eff.label && eff.label !== 'pas de données') {
    let color = 'var(--gray)';
    let bold = false;
    if (effRH.soutenu) { color = 'var(--red)'; bold = true; }
    else if (eff.delta !== null && eff.delta < 0) { color = 'var(--orange)'; bold = true; }
    else if (eff.delta === 0) { color = 'var(--green)'; bold = true; }
    effHtml = 'Écart vs théorique : <span style="color:' + color + (bold ? ';font-weight:700' : '') + '">' + eff.label + '</span>' + (effRH.soutenu ? ' <span style="color:var(--red);font-size:12px">(sous-effectif soutenu, 3 mois)</span>' : '');
  }
  let moyenneEquipeHtml = '<p style="color:var(--gray);font-size:13px;margin:0 0 10px">Pas de donnée.</p>';
  if (d.niveauEquipe !== null && d.niveauEquipe !== undefined) {
    const nv = Number(d.niveauEquipe);
    const color = nv >= 8 ? 'var(--green)' : (nv < 7 ? 'var(--red)' : 'var(--orange)');
    moyenneEquipeHtml = '<p style="font-size:14px;margin:0 0 10px">Note moyenne équipe : <span style="color:' + color + ';font-weight:700">' + nv + '/10</span></p>';
  }

  const managerLabel = d.manager ? (d.manager.prenom + ' ' + d.manager.nom) : '—';

  el.innerHTML = `
    <button class="back-btn" onclick="showNetworkView()">&larr; Retour au réseau</button>
    <div class="detail-header">
      <div>
        <h2>${d.magasin.libelle} <span style="color:var(--gray);font-weight:400;font-size:14px"> — ${d.magasin.code}</span></h2>
        <p class="sub">Animateur : ${d.magasin.animateur || '—'}</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="badge ${scoreClass(d.score)}">Score santé ${d.score !== null ? d.score : '—'}</span>
        <span class="badge badge-neutre">${d.daysSinceVisit !== null ? d.daysSinceVisit + ' jours sans visite (' + fmtDate(d.lastVisitDate) + ')' : 'jamais visité'}</span>
      </div>
    </div>

    <div class="pos-row">
      <div class="pos-chip">Positionnement mensuel <span class="v">${d.positionnementMensuel !== null ? d.positionnementMensuel + '%' : '—'}</span></div>
      <div class="pos-chip">Positionnement annuel <span class="v">${d.positionnementAnnuel !== null ? d.positionnementAnnuel + '%' : '—'}</span></div>
    </div>

    <p class="section-label">Vue d'ensemble</p>
    <div class="sub-grid" id="sub-grid"></div>

    <p class="section-label">Évolution du score — historique</p>
    <div class="chart-box"><canvas id="detail-chart" height="110"></canvas></div>

    <p class="section-label">Terrain</p>
    <div class="two-col">
      <div class="card"><h4>Actions non soldées (bilan de passage)</h4>${actionsHtml}</div>
      <div class="card"><h4>Kaizen — points non résolus</h4>${kaizenHtml}${cumulHtml}</div>
    </div>

    <p class="section-label">Performance commerciale — Pedlv</p>
    <div class="card">
      ${pedlvRows ? '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;font-weight:700;padding:4px 0">Indicateur</th><th style="text-align:right;font-weight:700;padding:4px 0">Valeur</th><th style="text-align:right;font-weight:700;padding:4px 0">Objectif</th><th></th></tr></thead><tbody>' + pedlvRows + '</tbody></table></div>' : '<p style="color:var(--gray);font-size:13px;margin:0">Pas de données Pedlv récentes.</p>'}
    </div>

    <p class="section-label">Équipe</p>
    <div class="two-col">
      <div class="card">
        <h4>Évaluation équipe</h4>
        ${moyenneEquipeHtml}
        ${equipeRows ? '<table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>' + equipeRows + '</tbody></table>' : '<p style="color:var(--gray);font-size:13px;margin:0">Pas de détail par tâche.</p>'}
      </div>
      <div class="card">
        <h4>Effectif</h4>
        <p style="font-size:13px;margin:0 0 6px">Manager : <b>${managerLabel}</b></p>
        <p style="font-size:13px;margin:0 0 6px">${effHtml}</p>
        <p style="font-size:13px;margin:0">${d.absenteisme && d.absenteisme.score !== null && d.absenteisme.score !== undefined ? 'Taux d\'absentéisme : ' + (Math.round((100 - d.absenteisme.score) * 10) / 10) + '%' : ''}</p>
      </div>
    </div>
  `;

  renderSubGrid(d);
  renderDetailChart(d.history || []);
  currentDetailHistory = d.history || [];
}

function renderSubGrid(d) {
  const sub = d.subScores || {};
  const grid = document.getElementById('sub-grid');
  grid.innerHTML = Object.keys(SUB_LABELS).map(key => {
    const val = sub[key];
    return `<button class="sub-card" onclick="openSubModal('${key}')">
      <p class="lbl">${SUB_LABELS[key]}</p>
      <p class="val" style="color:${val === null || val === undefined ? '#999' : (val >= 80 ? 'var(--green)' : val >= 60 ? 'var(--orange)' : 'var(--red)')}">${val !== null && val !== undefined ? Math.round(val) : '—'}</p>
    </button>`;
  }).join('');
}

function renderDetailChart(history) {
  if (detailChart) { detailChart.destroy(); detailChart = null; }
  const ctx = document.getElementById('detail-chart');
  if (!history.length) {
    ctx.parentElement.innerHTML = '<p style="color:var(--gray);font-size:13px;margin:0">Pas encore assez d\'historique.</p>';
    return;
  }
  detailChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: history.map(h => fmtDate(h.periode)),
      datasets: [{ data: history.map(h => h.score), borderColor: '#CC1719', backgroundColor: 'rgba(204,23,25,0.08)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 }, x: { grid: { display: false } } },
    },
  });
}

// ---------------------------------------------------------------- Modal sous-score
function openSubModal(key) {
  const history = currentDetailHistory;
  document.getElementById('modal-title').textContent = SUB_LABELS[key] + ' — historique';
  document.getElementById('modal-overlay').style.display = 'flex';
  if (modalChartInstance) { modalChartInstance.destroy(); modalChartInstance = null; }
  const ctx = document.getElementById('modal-chart');
  const points = history.map(h => ({ periode: h.periode, val: h.sousScores ? h.sousScores[key] : null })).filter(p => p.val !== null && p.val !== undefined);
  if (!points.length) {
    ctx.parentElement.innerHTML = '<p style="color:var(--gray);font-size:13px;margin:10px">Pas encore d\'historique pour ce sous-score.</p>';
    return;
  }
  modalChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map(p => fmtDate(p.periode)),
      datasets: [{ data: points.map(p => p.val), borderColor: '#CC1719', backgroundColor: 'rgba(204,23,25,0.08)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 }, x: { grid: { display: false } } },
    },
  });
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// ---------------------------------------------------------------- Boot
(function boot() {
  if (loadSession()) startApp();
})();
</script>
</body>
</html>
