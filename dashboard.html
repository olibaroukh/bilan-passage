<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard réseau — Optical Center</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard OC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --dark: #0D0D0D;
    --red: #E2231A;
    --cream: #F5F5F5;
    --green: #2E7D32;
    --green-bg: #E6F4E6;
    --orange: #B8710A;
    --orange-bg: #FCEFD9;
    --gray: #6b6b68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Montserrat', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--dark);
  }
  header.topbar {
    background: var(--dark);
    color: var(--cream);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.topbar h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header.topbar button {
    background: transparent;
    border: 1px solid #555;
    color: var(--cream);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---- Login ---- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dark);
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 28px;
    width: 320px;
    max-width: 90vw;
  }
  .login-card h2 { margin: 0 0 4px; font-size: 19px; }
  .login-card p.sub { color: var(--gray); font-size: 13px; margin: 0 0 20px; }
  .login-card label { display: block; font-size: 13px; margin: 14px 0 5px; font-weight: 500; }
  .login-card input {
    width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-family: inherit; font-size: 14px;
  }
  .login-card button.submit {
    width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 6px;
    background: var(--red); color: #fff; font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ---- Filtres ---- */
  .filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filters select, .filters input {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }

  /* ---- KPI ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 14px 16px; }
  .kpi-card .lbl { font-size: 12px; color: var(--gray); margin: 0 0 4px; }
  .kpi-card .val { font-size: 22px; font-weight: 700; margin: 0; }

  /* ---- Table ---- */
  table.dash-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  table.dash-table th {
    text-align: left; font-size: 12px; color: var(--gray); font-weight: 600;
    padding: 10px 12px; border-bottom: 1px solid #e5e2d9;
  }
  table.dash-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0efe9; }
  table.dash-table tr.row-clickable { cursor: pointer; }
  table.dash-table tr.row-clickable:hover { background: #faf9f5; }
  /* Tri des colonnes (29/09) */
  table.dash-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.dash-table th.sortable:hover { color: var(--dark); }
  table.dash-table th.sorted { color: var(--red); }
  table.dash-table th .sort-ind { font-size: 10px; margin-left: 3px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-vert { background: var(--green-bg); color: var(--green); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-rouge { background: #FBE4E4; color: var(--red); }
  .badge-neutre { background: #eee; color: var(--gray); }

  /* ---- Detail ---- */
  .back-btn {
    background: none; border: none; color: var(--red); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 14px;
  }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .detail-header h2 { margin: 0 0 2px; font-size: 21px; }
  .detail-header .sub { color: var(--gray); font-size: 13px; }
  .pos-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 20px; }
  .pos-chip { background: #fff; border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .pos-chip .v { font-weight: 700; font-size: 16px; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); margin: 22px 0 8px; }
  .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; }
  .sub-card {
    background: #fff; border: none; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer;
    font-family: inherit;
  }
  .sub-card .lbl { font-size: 11px; color: var(--gray); margin: 0 0 4px; }
  .sub-card .val { font-size: 17px; font-weight: 700; margin: 0; }

  .chart-box { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 6px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; }
  .item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0efe9; }
  .item-row:last-child { border-bottom: none; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-box { background: #fff; border-radius: 10px; padding: 18px; width: 420px; max-width: 100%; }
  .modal-box h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 480px) {
    main { padding: 14px 10px 50px; }
    header.topbar { padding: 12px 14px; }
    header.topbar h1 { font-size: 15px; }
    .detail-header h2 { font-size: 18px; }
    .card, .kpi-card, .chart-box { padding: 12px; }
  }

  .loading { text-align: center; padding: 40px; color: var(--gray); }

  /* ---- Liens vers les applis (27/09) ---- */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 8px; }
  .section-head .section-label { margin: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .card-head h4 { margin: 0; }
  .app-links { display: flex; gap: 14px; flex-wrap: wrap; }
  a.app-link { font-size: 12px; font-weight: 600; color: var(--red); text-decoration: none; white-space: nowrap; }
  a.app-link:hover { text-decoration: underline; }

  /* ---- Suivi manager (27/09) ---- */
  .sv-summary { font-size: 13px; margin: 0 0 8px; }
  .sv-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #f0efe9; }
  .sv-row:last-child { border-bottom: none; }
  .sv-lib { font-weight: 600; }
  .sv-meta { display: block; font-size: 12px; color: var(--gray); font-weight: 400; margin-top: 2px; }
  .sv-ech { white-space: nowrap; text-align: right; font-size: 12px; }
  .sv-ech b { display: block; font-size: 13px; }
  .sv-retard { color: var(--red); }
  .sv-bientot { color: var(--orange); }
  .sv-later { color: var(--gray); }
  details.sv-clos { margin-top: 10px; font-size: 13px; }
  details.sv-clos summary { cursor: pointer; color: var(--gray); font-size: 12px; }
  .sv-sub { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--gray); margin: 0 0 6px; }
  .sv-sub + .sv-summary { margin-top: 0; }
  .sv-block + .sv-block { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e2d9; }
  .sv-fait { color: var(--green); }

  /* ---- Onglets + vue « Aujourd'hui » (03/10) ---- */
  .main-tabs { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid #e5e2d9; }
  .main-tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer; margin-bottom: -1px; }
  .main-tabs button.active { color: var(--dark); border-bottom-color: var(--red); }
  .today-status { font-size: 13px; color: var(--gray); margin: -6px 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: livepulse 2s infinite; }
  @keyframes livepulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .link-btn { background: none; border: none; color: var(--red); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0; }
  .kpi-sub { font-size: 14px; font-weight: 500; color: var(--gray); }
  table.today-table th.c, table.today-table td.c { text-align: center; padding-left: 6px; padding-right: 6px; white-space: nowrap; }
  table.today-table td.c { min-width: 62px; }
  .t-mag { font-weight: 600; display: block; }
  .t-ar { display: block; font-size: 11px; color: var(--gray); margin-top: 2px; }
  .t-ok { color: var(--green); font-weight: 800; font-size: 16px; display: block; line-height: 1.1; }
  .t-ko { color: var(--red); font-weight: 800; font-size: 15px; display: block; line-height: 1.1; }
  .t-h { display: block; font-size: 11px; color: var(--gray); margin-top: 1px; }
  .t-ko-txt { color: var(--red); }
  .t-gris { font-size: 12px; color: #a3a3a0; }
  tr.t-inactif .t-mag { color: var(--gray); }
  .feed-row { display: flex; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid #f0efe9; }
  .feed-row:last-child { border-bottom: none; }
  .feed-h { font-weight: 700; min-width: 42px; color: var(--dark); }
  .feed-par { color: var(--gray); }
  .today-kpis { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); }
  table.today-table th:first-child, table.today-table td:first-child { position: sticky; left: 0; background: #fff; z-index: 1; min-width: 150px; }
  table.today-table tr.row-clickable:hover td:first-child { background: #faf9f5; }
  @media (max-width: 480px) {
    .main-tabs button { padding: 10px 10px; font-size: 13px; }
    .today-kpis { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .today-kpis .kpi-card { padding: 8px; }
    .today-kpis .kpi-card .lbl { font-size: 10px; }
    .today-kpis .kpi-card .val { font-size: 17px; }
    .today-kpis .kpi-sub { font-size: 11px; }
    table.today-table td:first-child, table.today-table th:first-child { min-width: 120px; max-width: 140px; }
  }

select,input,textarea,button{font-family:inherit}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>Dashboard réseau</h2>
    <p class="sub">Connexion avec ton identifiant Zimbra</p>
    <label for="login-user">Identifiant</label>
    <input type="text" id="login-user" placeholder="prenom.nom@optical-center.com" autocomplete="username">
    <label for="login-pass">Mot de passe</label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <button class="submit" onclick="doLogin()">Se connecter</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<div id="app-screen" style="display:none">
  <header class="topbar">
    <h1>Dashboard réseau</h1>
    <button onclick="logout()">Déconnexion</button>
  </header>
  <main>
    <nav class="main-tabs" id="main-tabs">
      <button data-tab="network" class="active" onclick="showNetworkView()">Santé réseau</button>
      <button data-tab="today" onclick="showTodayView()">Aujourd'hui</button>
    </nav>
    <div id="view-network"></div>
    <div id="view-today" style="display:none"></div>
    <div id="view-detail" style="display:none"></div>
    <div id="view-ar" style="display:none"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3 id="modal-title"></h3>
    <div class="chart-box" id="modal-chart-box" style="padding:0"><canvas id="modal-chart" height="180"></canvas></div>
    <div id="modal-list" style="display:none;font-size:13px;line-height:1.8"></div>
  </div>
</div>

<script>
// 26/09 (sécurité) : échappement du texte libre saisi dans les bilans avant
// injection en innerHTML — évite qu'un texte piégé s'exécute dans le dashboard.
function escDash(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const RELAY = 'https://zimbra-relay.oli-baroukh.workers.dev';
const STORE_TOKEN = 'OC-bilan-store-2026';

const SUB_LABELS = {
  actions: 'Actions', effectif: 'Effectif', absenteisme: 'Absentéisme', positionnement: 'Positionnement',
  pedlv: 'Pedlv', avis: 'Avis', equipe: 'Équipe', kaizen: 'Kaizen',
  entretiens: 'Entretiens', lancements: 'Lancements',
};

// 27/09 : liens directs vers les applis depuis la fiche magasin. Toutes les
// applis sont sur le même domaine (olibaroukh.github.io) : elles lisent la
// session AR du dashboard (localStorage 'bilan_ar_session') quand elles sont
// ouvertes avec ?magasin=CODE, et se positionnent directement sur le magasin.
const APPS_BASE = 'https://olibaroukh.github.io/';
function appLink(app, code, label) {
  return '<a class="app-link" href="' + APPS_BASE + app + '/?magasin=' + encodeURIComponent(code) + '" target="_blank" rel="noopener">' + escDash(label) + ' &#8599;</a>';
}

const SV_TYPES = {
  ecoute_fb: 'Écoute & Feedback', pilotage_optique: 'Pilotage Optique', pilotage_audio: 'Pilotage Audio',
  valorisation: 'Valorisation', remotivation: 'Remotivation', recadrage: 'Recadrage',
};
function svDateFr(iso) { return iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '—'; }
function svJours(fromIso, toIso) { return Math.round((Date.parse(toIso + 'T00:00:00Z') - Date.parse(fromIso + 'T00:00:00Z')) / 86400000); }

// Section « Suivi manager » (27/09) : actions / objectifs datés fixés lors des
// entretiens Suivi Managers (d.suivisManager, route /store-health-detail).
function renderSuiviManagerHtml(sm) {
  if (!sm) return '<p style="color:var(--gray);font-size:13px;margin:0">Données indisponibles (Worker à mettre à jour).</p>';
  const titre = '<p class="sv-sub">Entretiens Suivi Managers</p>';
  const today = sm.today || new Date().toISOString().slice(0, 10);
  const ouverts = sm.ouverts || [];
  const clotures = sm.clotures || [];
  if (!ouverts.length && !clotures.length) {
    return titre + '<p style="color:var(--gray);font-size:13px;margin:0">Aucune action ni objectif daté fixé en entretien pour l\'instant.</p>';
  }
  const meta = s => [s.collaborateur, SV_TYPES[s.type] || s.type, s.poseLe ? 'fixé le ' + svDateFr(s.poseLe) + (s.posePar ? ' par ' + s.posePar : '') : ''].filter(Boolean).map(escDash).join(' · ');
  const nbRetard = ouverts.filter(s => s.echeance && s.echeance < today).length;
  let html = titre + '<p class="sv-summary"><b>' + ouverts.length + '</b> action' + (ouverts.length > 1 ? 's' : '') + ' en cours'
    + (nbRetard ? ' · <b class="sv-retard">' + nbRetard + ' en retard</b>' : '') + '</p>';
  html += ouverts.length ? ouverts.map(s => {
    const j = s.echeance ? svJours(today, s.echeance) : null;
    let cls = 'sv-later', txt = '';
    if (j === null) { txt = 'sans date'; }
    else if (j < 0) { cls = 'sv-retard'; txt = 'en retard de ' + (-j) + ' j'; }
    else if (j === 0) { cls = 'sv-bientot'; txt = "aujourd'hui"; }
    else if (j <= 7) { cls = 'sv-bientot'; txt = 'dans ' + j + ' j'; }
    else { txt = 'dans ' + j + ' j'; }
    return '<div class="sv-row"><span><span class="sv-lib">' + escDash(s.libelle) + '</span><span class="sv-meta">' + meta(s) + '</span></span>'
      + '<span class="sv-ech ' + cls + '"><b>' + svDateFr(s.echeance) + '</b>' + txt + '</span></div>';
  }).join('') : '<p style="color:var(--gray);font-size:13px;margin:0">Aucune action en cours.</p>';
  if (clotures.length) {
    html += '<details class="sv-clos"><summary>Clôturées ces 30 derniers jours (' + clotures.length + ')</summary>'
      + clotures.map(s => {
        const fait = s.statut === 'fait';
        return '<div class="sv-row"><span><span class="sv-lib">' + escDash(s.libelle) + '</span><span class="sv-meta">' + meta(s) + '</span></span>'
          + '<span class="sv-ech" style="color:' + (fait ? 'var(--green)' : 'var(--red)') + '"><b>' + (fait ? '✓ Fait' : '✗ Pas fait') + '</b>'
          + 'le ' + svDateFr(s.clotureLe) + (s.cloturePar ? ' · ' + escDash(s.cloturePar) : '') + '<br>échéance ' + svDateFr(s.echeance) + '</span></div>';
      }).join('') + '</details>';
  }
  return html;
}

// 27/09 : plan d'action de la dernière visite Accompagnement Manager
// (d.accompagnement, route /store-health-detail). Non faites d'abord, par échéance.
function renderAccompagnementHtml(acc, withData) {
  const titre = '<p class="sv-sub">Dernière visite d\'accompagnement</p>';
  if (!withData) return '';
  if (!acc) return titre + '<p style="color:var(--gray);font-size:13px;margin:0">Aucune visite d\'accompagnement enregistrée pour ce magasin.</p>';
  const today = new Date().toISOString().slice(0, 10);
  const statutVisite = acc.statut === 'finalise' ? 'finalisée' : 'brouillon, pas encore finalisée';
  const entete = 'Visite du <b>' + svDateFr(acc.dateVisite) + '</b>' + (acc.itinerant ? ' par ' + escDash(acc.itinerant) : '')
    + (acc.manager ? ' · manager : ' + escDash(acc.manager) : '') + ' <span style="color:var(--gray)">(' + statutVisite + ')</span>';
  const actions = (acc.actions || []).slice().sort((a, b) =>
    ((a.statut === 'Fait') - (b.statut === 'Fait')) || String(a.echeance || '9999').localeCompare(String(b.echeance || '9999')));
  if (!actions.length) return titre + '<p class="sv-summary">' + entete + '</p><p style="color:var(--gray);font-size:13px;margin:0">Aucune action au plan.</p>';
  const nbOuvertes = actions.filter(a => a.statut !== 'Fait').length;
  const nbRetard = actions.filter(a => a.statut !== 'Fait' && a.echeance && a.echeance < today).length;
  let html = titre + '<p class="sv-summary">' + entete + '<br><b>' + nbOuvertes + '</b> action' + (nbOuvertes > 1 ? 's' : '') + ' non faite' + (nbOuvertes > 1 ? 's' : '')
    + ' sur ' + actions.length + (nbRetard ? ' · <b class="sv-retard">' + nbRetard + ' en retard</b>' : '') + '</p>';
  html += actions.map(a => {
    const meta = [a.responsable ? 'Responsable : ' + a.responsable : '', a.statut, a.origine === 'bilan' ? 'reprise du bilan de passage' : ''].filter(Boolean).map(escDash).join(' · ');
    let cls = 'sv-later', txt = '';
    if (a.statut === 'Fait') { cls = 'sv-fait'; txt = 'fait'; }
    else if (!a.echeance) { txt = 'sans date'; }
    else {
      const j = svJours(today, a.echeance);
      if (j < 0) { cls = 'sv-retard'; txt = 'en retard de ' + (-j) + ' j'; }
      else if (j === 0) { cls = 'sv-bientot'; txt = "aujourd'hui"; }
      else { cls = j <= 7 ? 'sv-bientot' : 'sv-later'; txt = 'dans ' + j + ' j'; }
    }
    return '<div class="sv-row"><span><span class="sv-lib"' + (a.statut === 'Fait' ? ' style="text-decoration:line-through;color:var(--gray)"' : '') + '>' + escDash(a.action) + '</span><span class="sv-meta">' + meta + '</span></span>'
      + '<span class="sv-ech ' + cls + '"><b>' + svDateFr(a.echeance) + '</b>' + txt + '</span></div>';
  }).join('');
  return html;
}

let session = null;
let allResults = [];
let networkTrend = [];
let networkChart = null;
let detailChart = null;
let currentDetailHistory = [];
let modalChartInstance = null;

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem('bilan_ar_session') || 'null');
    if (s && s.exp > Date.now()) { session = s; return s; }
  } catch(e) {}
  session = null;
  return null;
}

async function doLogin() {
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const zimbraUser = document.getElementById('login-user').value.trim();
  const zimbraPass = document.getElementById('login-pass').value;
  if (!zimbraUser || !zimbraPass) {
    errEl.textContent = 'Identifiant et mot de passe requis';
    errEl.style.display = 'block';
    return;
  }
  try {
    const resp = await fetch(RELAY + '/ar-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Store-Token': STORE_TOKEN },
      body: JSON.stringify({ zimbraUser, zimbraPass }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || ('Erreur ' + resp.status));
    session = { token: data.sessionToken, ar: data.ar, exp: Date.now() + data.expiresInMs };
    localStorage.setItem('bilan_ar_session', JSON.stringify(session));
    startApp();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

// ---------------------------------------------------------------- Tri des tableaux (29/09)
// Clic sur un en-tête : tri croissant, second clic : décroissant. Les valeurs
// absentes (« — », « jamais ») restent toujours en bas, quel que soit le sens.
const SORT_GETTERS = {
  libelle: r => r.libelle || null,
  animateur: r => r.animateur || null,
  score: r => (r.score === null || r.score === undefined) ? null : Number(r.score),
  kaizen: r => (r.kaizenDernierScoreCloture !== null && r.kaizenDernierScoreCloture !== undefined && r.kaizenDernierScoreMax)
    ? r.kaizenDernierScoreCloture / r.kaizenDernierScoreMax : null,
  actions: r => r.actionsNonSoldees ? r.actionsNonSoldees.count : 0,
  // « jamais visité » = le plus ancien : tout en haut en tri décroissant, tout en bas en croissant.
  visite: r => (r.daysSinceVisit === null || r.daysSinceVisit === undefined) ? Infinity : r.daysSinceVisit,
};
const tableSorts = { network: { key: 'score', dir: 1 }, ar: { key: 'score', dir: 1 } };

function sortRows(rows, sort) {
  const get = SORT_GETTERS[sort.key];
  return rows.slice().sort((a, b) => {
    const va = get(a), vb = get(b);
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    const cmp = (typeof va === 'string' || typeof vb === 'string')
      ? String(va).localeCompare(String(vb), 'fr', { sensitivity: 'base' })
      : (va === vb ? 0 : (va < vb ? -1 : 1));
    return cmp * sort.dir || String(a.libelle || '').localeCompare(String(b.libelle || ''), 'fr');
  });
}

function thSort(table, key, label) {
  const s = tableSorts[table];
  const active = s.key === key;
  return '<th class="sortable' + (active ? ' sorted' : '') + '" data-table="' + table + '" data-key="' + key + '" onclick="setTableSort(\'' + table + '\', \'' + key + '\')" title="Trier">'
    + label + '<span class="sort-ind">' + (active ? (s.dir === 1 ? '▲' : '▼') : '↕') + '</span></th>';
}

function setTableSort(table, key) {
  const s = tableSorts[table];
  if (s.key === key) s.dir = -s.dir; else { s.key = key; s.dir = 1; }
  document.querySelectorAll('th.sortable[data-table="' + table + '"]').forEach(th => {
    const active = th.dataset.key === s.key;
    th.classList.toggle('sorted', active);
    th.querySelector('.sort-ind').textContent = active ? (s.dir === 1 ? '▲' : '▼') : '↕';
  });
  if (table === 'network') renderTable(); else renderArStoresRows();
}

  // 27/09 : deux listes bien distinctes. 1) Actions reportées d'un bilan à
  // l'autre sans être soldées (fromPrevious) : seules à peser sur le score de
  // santé (règle inchangée). 2) Actions du dernier bilan dont l'échéance est
  // dépassée mais pas encore reprises à un passage : simple alerte, hors score.
  const todayIso = new Date().toISOString().slice(0, 10);
  const actItems = (d.actionsNonSoldees && d.actionsNonSoldees.items) || [];
  const actScore = actItems.filter(a => a.fromPrevious);
  const actDepassees = actItems.filter(a => !a.fromPrevious && a.date && a.date < todayIso);
  const actEch = a => a.date ? '<span class="sv-meta">Échéance ' + svDateFr(a.date) + (a.date < todayIso ? ' · <span class="sv-retard">dépassée de ' + svJours(a.date, todayIso) + ' j</span>' : '') + (a.who ? ' · ' + escDash(a.who) : '') + '</span>' : (a.who ? '<span class="sv-meta">' + escDash(a.who) + '</span>' : '');
  const actionsHtml =
    '<p class="sv-sub">Impactent le score santé</p>'
    + (actScore.length
      ? actScore.map(a =>
          '<div class="item-row"><span>' + escDash(a.text) + actEch(a) + '</span><span style="color:var(--red);white-space:nowrap">' + (a.repriseCount + 1) + ' visites</span></div>'
        ).join('')
      : '<p style="color:var(--gray);font-size:13px;margin:0 0 4px">Aucune action reportée sans être soldée.</p>')
    + '<p class="sv-sub" style="margin-top:14px">Échéance dépassée — sans impact sur le score</p>'
    + (actDepassees.length
      ? actDepassees.map(a =>
          '<div class="item-row"><span>' + escDash(a.text) + actEch(a) + '</span><span style="color:var(--orange);white-space:nowrap">à reprendre au prochain passage</span></div>'
        ).join('')
      : '<p style="color:var(--gray);font-size:13px;margin:0">Aucune action du dernier bilan en retard.</p>');

  // 19/09 : score du mois en cours (audit pas forcément clôturé — d.kaizenScoreMois
  // vient de getKaizenHealthMap, distinct de dernierScoreCloture utilisé dans le
  // score de santé). Affiché même "en cours" pour donner une visibilité immédiate
  // plutôt que d'attendre la clôture du 1er du mois suivant.
  const scoreMoisHtml = (d.kaizenScoreMois !== null && d.kaizenScoreMois !== undefined)
    ? '<p style="font-size:14px;margin:0 0 10px">Score du mois en cours : <span style="font-weight:700">' + d.kaizenScoreMois + (d.kaizenScoreMaxMois ? '/' + d.kaizenScoreMaxMois : '') + '</span>' + (d.kaizenClosedMois ? '' : ' <span style="color:var(--gray);font-size:12px">(en cours, pas encore clôturé)</span>') + '</p>'
    : '<p style="color:var(--gray);font-size:13px;margin:0 0 10px">Pas encore d\'audit ce mois-ci.</p>';
  const kaizenHtml = (d.kaizenPointsNonResolus && d.kaizenPointsNonResolus.length)
    ? d.kaizenPointsNonResolus.map(k =>
        '<div class="item-row"><span>' + k.label + (k.zoneNom ? ' — ' + k.zoneNom : '') + '</span><span style="color:var(--red)">' + k.moisConsecutifs + ' mois</span></div>'
      ).join('')
    : '<p style="color:var(--gray);font-size:13px;margin:0">Aucun point non résolu.</p>';
  const cumulHtml = d.kaizenCumulAnnuel !== null && d.kaizenCumulAnnuel !== undefined
    ? '<p style="font-size:12px;color:var(--gray);margin:10px 0 0">Cumul annuel : ' + d.kaizenCumulAnnuel + '/400</p>' : '';

  // Checklist réseau (24/09) : points réseau cochés / oubliés sur les derniers passages.
  const ckEsc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ckPassages = d.checklistReseauPassages || [];
  const checklistHtml = ckPassages.length
    ? ckPassages.map(p => {
        const complet = p.coches === p.total;
        const dateFr = p.date ? String(p.date).split('-').reverse().join('/') : '—';
        return '<div class="item-row" style="flex-wrap:wrap;gap:4px 10px"><span>' + dateFr + (p.ar ? ' · ' + ckEsc(p.ar) : '') + '</span>'
          + '<span style="font-weight:700;color:' + (complet ? '#1a7a45' : 'var(--red)') + '">' + p.coches + '/' + p.total + '</span>'
          + (p.oublis.length ? '<span style="flex-basis:100%;font-size:12px;color:var(--gray)">Oublié : ' + p.oublis.map(ckEsc).join(' · ') + '</span>' : '')
          + '</div>';
      }).join('')
    : '<p style="color:var(--gray);font-size:13px;margin:0">Aucun passage avec checklist réseau pour l\'instant.</p>';

  const pedlvRows = (d.pedlvIndicateurs || []).map(i => {
    const valeurAffichee = i.cle === 'tva' && i.valeur !== null && i.valeur !== undefined ? Math.round(i.valeur) : (i.valeur ?? '—');
    return `
    <tr>
      <td style="font-weight:600">${i.cle}</td>
      <td style="text-align:right">${valeurAffichee}</td>
      <td style="text-align:right;color:var(--gray)">${i.objectif ?? '—'}</td>
      <td style="text-align:right"><span class="badge badge-${i.statut}">${i.statut}${i.semainesRouge ? ' · ' + i.semainesRouge + ' sem.' : ''}</span></td>
    </tr>`;
  }).join('');

  const equipeRows = (d.equipeTaches || []).map(t => {
    let moyenneHtml = '—';
    if (t.moyenne !== null && t.moyenne !== undefined) {
      const color = t.moyenne >= 8 ? 'var(--green)' : (t.moyenne < 7 ? 'var(--red)' : 'var(--orange)');
      moyenneHtml = '<span style="color:' + color + ';font-weight:700">' + t.moyenne + '</span>';
    }
    return `
    <tr>
      <td>${t.tache}</td>
      <td>${t.responsable || '<span style="color:var(--red)">non assigné</span>'}</td>
      <td style="text-align:right">${moyenneHtml}</td>
    </tr>`;
  }).join('');

  const eff = d.effectif || {};
  const effRH = d.effectifRH || {};
  let effHtml = 'Pas de donnée effectif RH';
  if (eff.label && eff.label !== 'pas de données') {
    let color = 'var(--gray)';
    let bold = false;
    if (effRH.soutenu) { color = 'var(--red)'; bold = true; }
    else if (eff.delta !== null && eff.delta < 0) { color = 'var(--orange)'; bold = true; }
    else if (eff.delta === 0) { color = 'var(--green)'; bold = true; }
    effHtml = 'Écart vs théorique : <span style="color:' + color + (bold ? ';font-weight:700' : '') + '">' + eff.label + '</span>' + (effRH.soutenu ? ' <span style="color:var(--red);font-size:12px">(sous-effectif soutenu, 3 mois)</span>' : '');
  }
  let moyenneEquipeHtml = '<p style="color:var(--gray);font-size:13px;margin:0 0 10px">Pas de donnée.</p>';
  if (d.niveauEquipe !== null && d.niveauEquipe !== undefined) {
    const nv = Number(d.niveauEquipe);
    const color = nv >= 8 ? 'var(--green)' : (nv < 7 ? 'var(--red)' : 'var(--orange)');
    moyenneEquipeHtml = '<p style="font-size:14px;margin:0 0 10px">Note moyenne équipe : <span style="color:' + color + ';font-weight:700">' + nv + '/10</span></p>';
  }

  const managerLabel = d.manager || '—';

  // 26/09 (Suivi Managers v2) : la couverture compte pilotage optique/audio,
  // valorisation et remotivation (TYPES_ENTRETIENS_COMPTES du Worker) — d'où le
  // libellé « entretien individuel » au lieu de « pilotage », + le détail par type.
  // Suivi Managers (18/09, revu 18/09) — 4 lignes dans la carte Effectif :
  // pilotage et lancements gardent le ratio "fait/éligible" (couverture
  // collaborateurs / jours ouvrés, déjà calculé par getEntretiensLancementsMap
  // côté Worker), écoute & feedback et recadrage sont de simples décomptes
  // bruts du mois (pas de notion d'éligibilité pour ces deux-là).
  // d.entretiensLancements vient de buildStoreHealthResults, jamais recalculé
  // ici. 0 partout si le champ est absent (magasin sans donnée ce mois-ci).
  const el2 = d.entretiensLancements || { nbVus: 0, nbEligibles: 0, joursLances: 0, joursOuverts: 0, nbPilotage: 0, nbValorisation: 0, nbRemotivation: 0, nbEcouteFb: 0, nbRecadrage: 0 };
  const moisLabelCourt = new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const suiviManagersHtml = `
    <p style="font-size:11px;letter-spacing:.04em;color:var(--gray);margin:12px 0 6px">Suivi Managers — ${moisLabelCourt}</p>
    <div class="item-row"><span>Collaborateurs vus en entretien individuel</span><span style="font-weight:700">${el2.nbVus}/${el2.nbEligibles}</span></div>
    <div class="item-row" style="padding-left:12px;font-size:12px;color:var(--gray)"><span>Entretiens pilotage / valorisation / remotivation</span><span>${el2.nbPilotage || 0} / ${el2.nbValorisation || 0} / ${el2.nbRemotivation || 0}</span></div>
    <div class="item-row"><span>Lancements de journée</span><span style="font-weight:700">${el2.joursLances}/${el2.joursOuverts || '?'}</span></div>
    <div class="item-row"><span>Écoute &amp; Feedback <span style="font-weight:400;color:var(--gray)">(hors score)</span></span><span style="font-weight:700">${el2.nbEcouteFb}</span></div>
    <div class="item-row"><span>Entretiens de recadrage <span style="font-weight:400;color:var(--gray)">(hors score)</span></span><span style="font-weight:700">${el2.nbRecadrage}</span></div>
  `;

  el.innerHTML = `
    <button class="back-btn" onclick="goBack()">&larr; Retour</button>
    <div class="detail-header">
      <div>
        <h2>${d.magasin.libelle} <span style="color:var(--gray);font-weight:400;font-size:14px"> — ${d.magasin.code}</span></h2>
        <p class="sub">Animateur : ${d.magasin.animateur || '—'}</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="badge ${scoreClass(d.score)}">Score santé ${d.score !== null ? d.score : '—'}</span>
        <span class="badge badge-neutre">${d.daysSinceVisit !== null ? d.daysSinceVisit + ' jours sans visite (' + fmtDate(d.lastVisitDate) + ')' : 'jamais visité'}</span>
      </div>
    </div>

    <div class="pos-row">
      <div class="pos-chip">Positionnement mensuel <span class="v">${d.positionnementMensuel !== null ? d.positionnementMensuel + '%' : '—'}</span></div>
      <div class="pos-chip">Positionnement annuel <span class="v">${d.positionnementAnnuel !== null ? d.positionnementAnnuel + '%' : '—'}</span></div>
      <div class="pos-chip">Objectif annuel <span class="v">${d.objectifAnnuel !== null && d.objectifAnnuel !== undefined ? d.objectifAnnuel + ' k€' : '—'}</span></div>
      <div class="pos-chip">CA prévisionnel annuel <span class="v">${d.caPrevisionnelAnnuel !== null && d.caPrevisionnelAnnuel !== undefined ? d.caPrevisionnelAnnuel + ' k€' : '—'}</span></div>
    </div>

    <p class="section-label">Vue d'ensemble</p>
    <div class="sub-grid" id="sub-grid"></div>

    <p class="section-label">Évolution du score — historique</p>
    <div class="chart-box"><canvas id="detail-chart" height="110"></canvas></div>

    <p class="section-label">Terrain</p>
    <div class="two-col">
      <div class="card"><div class="card-head"><h4>Actions du bilan de passage</h4>${appLink('bilan-passage', d.magasin.code, 'Bilan de Passage')}</div>${actionsHtml}</div>
      <div class="card"><div class="card-head"><h4>Kaizen — points non résolus</h4>${d.magasin.concept ? appLink('kaizen', d.magasin.code, 'Kaizen') : ''}</div>${scoreMoisHtml}${kaizenHtml}${cumulHtml}</div>
    </div>
    <div class="card" style="margin-top:12px"><h4>Checklist réseau — derniers passages</h4>${checklistHtml}</div>

    <p class="section-label">Performance commerciale — Pedlv</p>
    <div class="card">
      ${pedlvRows ? '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;font-weight:700;padding:4px 0">Indicateur</th><th style="text-align:right;font-weight:700;padding:4px 0">Valeur</th><th style="text-align:right;font-weight:700;padding:4px 0">Objectif</th><th></th></tr></thead><tbody>' + pedlvRows + '</tbody></table></div>' : '<p style="color:var(--gray);font-size:13px;margin:0">Pas de données Pedlv récentes.</p>'}
    </div>

    <p class="section-label">Équipe</p>
    <div class="two-col">
      <div class="card">
        <div class="card-head"><h4>Évaluation équipe</h4>${appLink('evaluation-equipe', d.magasin.code, 'Évaluation Équipe')}</div>
        ${moyenneEquipeHtml}
        ${equipeRows ? '<table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>' + equipeRows + '</tbody></table>' : '<p style="color:var(--gray);font-size:13px;margin:0">Pas de détail par tâche.</p>'}
      </div>
      <div class="card">
        <h4>Effectif</h4>
        <p style="font-size:13px;margin:0 0 6px">Manager : <b>${managerLabel}</b></p>
        <p style="font-size:13px;margin:0 0 6px">${effHtml}</p>
        <p style="font-size:13px;margin:0">${d.absenteisme && d.absenteisme.score !== null && d.absenteisme.score !== undefined ? 'Taux d\'absentéisme : ' + (Math.round((100 - d.absenteisme.score) * 10) / 10) + '%' : ''}</p>
        ${suiviManagersHtml}
      </div>
    </div>

    <div class="section-head">
      <p class="section-label">Suivi manager — actions et échéances</p>
      <div class="app-links">${appLink('suivi-managers', d.magasin.code, 'Suivi Managers')}${session && session.ar === 'ALL' ? appLink('accompagnement-manager', d.magasin.code, 'Accompagnement Manager') : ''}</div>
    </div>
    <div class="card">
      <div class="sv-block">${'accompagnement' in d ? renderAccompagnementHtml(d.accompagnement, true) : '<p class="sv-sub">Dernière visite d\'accompagnement</p><p style="color:var(--gray);font-size:13px;margin:0">Worker pas encore mis à jour : redéployer zimbra-relay depuis GitHub.</p>'}</div>
      <div class="sv-block">${renderSuiviManagerHtml(d.suivisManager)}</div>
    </div>

    <p class="section-label">Conseils</p>
    <div class="card">
      <button id="advice-btn" onclick="generateAdvice('${d.magasin.code}')" style="background:var(--red);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">Générer des conseils d'action</button>
      <div id="advice-content" style="margin-top:12px;font-size:13px;line-height:1.6;white-space:pre-wrap"></div>
    </div>
  `;

  renderSubGrid(d);
  renderDetailChart(d.history || []);
  currentDetailHistory = d.history || [];
}

function renderSubGrid(d) {
  const sub = d.subScores || {};
  const grid = document.getElementById('sub-grid');
  grid.innerHTML = Object.keys(SUB_LABELS).map(key => {
    const val = sub[key];
    return `<button class="sub-card" onclick="openSubModal('${key}')">
      <p class="lbl">${SUB_LABELS[key]}</p>
      <p class="val" style="color:${val === null || val === undefined ? '#999' : (val >= 80 ? 'var(--green)' : val >= 60 ? 'var(--orange)' : 'var(--red)')}">${val !== null && val !== undefined ? Math.round(val) : '—'}</p>
    </button>`;
  }).join('');
}

function renderDetailChart(history) {
  if (detailChart) { detailChart.destroy(); detailChart = null; }
  const ctx = document.getElementById('detail-chart');
  if (!history.length) {
    ctx.parentElement.innerHTML = '<p style="color:var(--gray);font-size:13px;margin:0">Pas encore assez d\'historique.</p>';
    return;
  }
  detailChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: history.map(h => fmtDate(h.periode)),
      datasets: [{ data: history.map(h => h.score), borderColor: '#E2231A', backgroundColor: 'rgba(226,35,26,0.08)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 }, x: { grid: { display: false } } },
    },
  });
}

// ---------------------------------------------------------------- Modal sous-score
function openSubModal(key) {
  const history = currentDetailHistory;
  document.getElementById('modal-title').textContent = SUB_LABELS[key] + ' — historique';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-chart-box').style.display = 'block';
  document.getElementById('modal-list').style.display = 'none';
  if (modalChartInstance) { modalChartInstance.destroy(); modalChartInstance = null; }
  const ctx = document.getElementById('modal-chart');
  const points = history.map(h => ({ periode: h.periode, val: h.sousScores ? h.sousScores[key] : null })).filter(p => p.val !== null && p.val !== undefined);
  if (!points.length) {
    ctx.parentElement.innerHTML = '<p style="color:var(--gray);font-size:13px;margin:10px">Pas encore d\'historique pour ce sous-score.</p>';
    return;
  }
  modalChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map(p => fmtDate(p.periode)),
      datasets: [{ data: points.map(p => p.val), borderColor: '#E2231A', backgroundColor: 'rgba(226,35,26,0.08)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 }, x: { grid: { display: false } } },
    },
  });
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// ---------------------------------------------------------------- Modal magasins vacants (Évaluation équipe, vue AR)
let currentEquipeTaches = [];

function openVacantModal(tache) {
  const entry = currentEquipeTaches.find(t => t.tache === tache);
  const magasins = entry ? entry.magasinsVacants || [] : [];
  document.getElementById('modal-title').textContent = tache + ' — magasins sans responsable assigné';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-chart-box').style.display = 'none';
  const list = document.getElementById('modal-list');
  list.style.display = 'block';
  list.innerHTML = magasins.length
    ? magasins.map(m => '<div style="padding:4px 0;border-bottom:0.5px solid #eee">' + m + '</div>').join('')
    : '<p style="color:var(--gray);margin:0">Aucun magasin vacant sur cette tâche.</p>';
}

async function generateAdvice(code) {
  const btn = document.getElementById('advice-btn');
  const content = document.getElementById('advice-content');
  btn.disabled = true;
  btn.textContent = 'Génération en cours…';
  content.textContent = '';
  try {
    const resp = await fetch(RELAY + '/store-advice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ magasin_code: code }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Erreur de génération');
    content.textContent = data.conseils;
    btn.textContent = 'Régénérer';
  } catch(e) {
    content.textContent = 'Erreur : ' + e.message;
    btn.textContent = 'Générer des conseils d\'action';
  } finally {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------- Onglet « Aujourd'hui » (03/10)
// Activité du jour par magasin (route /activite-jour). Même périmètre que la vue
// réseau : Olivier voit tout le réseau, chaque AR ses magasins (filtré côté Worker).
// Lancement de journée = seul outil attendu chaque jour ouvert, « manquant » après
// l'heure butoir. Rafraîchissement automatique toutes les 2 min 30 tant que l'onglet
// est affiché sur le jour en cours.
let currentListView = 'network';
let todayData = null;
let todayJour = null;
let todayTimer = null;
const TODAY_REFRESH_MS = 150000;
const TODAY_OUTILS = [
  { key: 'lancement', label: 'Lancement' },
  { key: 'bilan', label: 'Bilan' },
  { key: 'pedlv', label: 'PEDLV' },
  { key: 'kaizen', label: 'Kaizen' },
  { key: 'entretien', label: 'Entretien' },
  { key: 'observation', label: 'Obs.' },
  { key: 'equipe', label: 'Éval. équipe' },
];
const TODAY_OUTIL_LABELS = {
  lancement: 'Lancement', bilan: 'Bilan de passage', pedlv: 'PEDLV', kaizen: 'Kaizen',
  entretien: 'Entretien', observation: 'Observation', equipe: 'Évaluation équipe',
};

function setTabs(active) {
  const nav = document.getElementById('main-tabs');
  if (!nav) return;
  nav.style.display = active ? 'flex' : 'none';
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.tab === active));
}

function goBack() {
  if (currentListView === 'today') showTodayView(); else showNetworkView();
}

function parisTodayIsoDash() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); }
function addDaysIsoDash(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
// Jours consultables : du lundi de la semaine en cours à aujourd'hui (au-delà,
// les observations et les envois PEDLV bruts ont été purgés le dimanche soir).
function todayJoursDisponibles() {
  const today = parisTodayIsoDash();
  const dow = new Date(today + 'T00:00:00Z').getUTCDay();
  const nb = (dow + 6) % 7;
  const jours = [];
  for (let i = 0; i <= nb; i++) jours.push(addDaysIsoDash(today, -i));
  return jours;
}
function jourLabel(iso, today) {
  if (iso === today) return "Aujourd'hui";
  if (iso === addDaysIsoDash(today, -1)) return 'Hier';
  const d = new Date(iso + 'T12:00:00Z');
  const s = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function stopTodayTimer() { if (todayTimer) { clearInterval(todayTimer); todayTimer = null; } }

async function showTodayView() {
  currentListView = 'today';
  document.getElementById('view-network').style.display = 'none';
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-ar').style.display = 'none';
  setTabs('today');
  const el = document.getElementById('view-today');
  el.style.display = 'block';
  if (!todayJour) todayJour = parisTodayIsoDash();
  if (!todayData) el.innerHTML = '<div class="loading">Chargement…</div>';
  await loadToday();
  stopTodayTimer();
  todayTimer = setInterval(() => {
    if (document.hidden || currentListView !== 'today' || document.getElementById('view-today').style.display === 'none') return;
    if (todayJour !== parisTodayIsoDash()) return;
    loadToday(true);
  }, TODAY_REFRESH_MS);
}

async function loadToday(silent) {
  const el = document.getElementById('view-today');
  try {
    const resp = await fetch(RELAY + '/activite-jour?jour=' + encodeURIComponent(todayJour), { headers: authHeaders() });
    const data = await resp.json();
    if (resp.status === 401) { logout(); return; }
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Erreur de chargement');
    todayData = data;
    renderTodayView();
  } catch (e) {
    if (silent && todayData) return; // on garde l'affichage précédent sur un échec de rafraîchissement
    el.innerHTML = '<div class="loading">Erreur : ' + escDash(e.message) + '</div>';
  }
}

function changeTodayJour(v) { todayJour = v; todayData = null; showTodayView(); }

function magasinActif(m) {
  return (m.lancement && m.lancement.statut === 'fait') || !!m.bilan || (m.pedlv && m.pedlv.fait)
    || (m.kaizen && m.kaizen.fait) || !!m.entretien || !!m.observation || !!m.equipe;
}
function nbOutilsFaits(m) {
  return [m.lancement && m.lancement.statut === 'fait', !!m.bilan, m.pedlv && m.pedlv.fait, m.kaizen && m.kaizen.fait,
    !!m.entretien, !!m.observation, !!m.equipe].filter(Boolean).length;
}

function renderTodayView() {
  const el = document.getElementById('view-today');
  const d = todayData;
  const prevAr = document.getElementById('today-ar') ? document.getElementById('today-ar').value : '';
  const prevSearch = document.getElementById('today-search') ? document.getElementById('today-search').value : '';
  const prevSort = document.getElementById('today-sort') ? document.getElementById('today-sort').value : 'libelle';
  const ars = [...new Set(d.magasins.map(m => m.animateur).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  const jours = todayJoursDisponibles();
  if (!jours.includes(d.jour)) jours.push(d.jour);
  const enDirect = d.jour === d.today;

  el.innerHTML = `
    <div class="filters">
      <select id="today-jour" onchange="changeTodayJour(this.value)">
        ${jours.map(j => '<option value="' + j + '"' + (j === d.jour ? ' selected' : '') + '>' + escDash(jourLabel(j, d.today)) + '</option>').join('')}
      </select>
      ${ars.length > 1 ? '<select id="today-ar" onchange="renderTodayBody()"><option value="">Tous les animateurs</option>' + ars.map(a => '<option value="' + escDash(a) + '"' + (a === prevAr ? ' selected' : '') + '>' + escDash(a) + '</option>').join('') + '</select>' : ''}
      <select id="today-sort" onchange="renderTodayBody()">
        <option value="libelle"${prevSort === 'libelle' ? ' selected' : ''}>Tri : magasin</option>
        <option value="moins"${prevSort === 'moins' ? ' selected' : ''}>Tri : moins actifs d'abord</option>
        <option value="plus"${prevSort === 'plus' ? ' selected' : ''}>Tri : plus actifs d'abord</option>
      </select>
      <input type="text" id="today-search" placeholder="Rechercher un magasin" value="${escDash(prevSearch)}" oninput="renderTodayBody()">
    </div>
    <p class="today-status">${enDirect
      ? '<span><span class="live-dot"></span> En direct · actualisé à ' + escDash(d.maintenant) + ' · lancement attendu avant ' + escDash(d.butoir.replace(':', 'h')) + '</span>'
      : '<span>Journée du ' + escDash(d.jour.split('-').reverse().join('/')) + '</span>'}
      <button class="link-btn" onclick="loadToday()">Actualiser</button></p>
    <div class="kpi-row today-kpis" id="today-kpis"></div>
    <div class="table-wrap"><table class="dash-table today-table">
      <thead><tr><th>Magasin</th>${TODAY_OUTILS.map(o => '<th class="c">' + o.label + '</th>').join('')}</tr></thead>
      <tbody id="today-body"></tbody>
    </table></div>
    <div class="card" style="margin-top:16px">
      <h4>Fil de la journée</h4>
      <div id="today-feed"></div>
    </div>
  `;
  renderTodayBody();
}

function todayFiltered() {
  const d = todayData;
  const arSel = document.getElementById('today-ar');
  const ar = arSel ? arSel.value : '';
  const search = (document.getElementById('today-search').value || '').trim().toLowerCase();
  let rows = d.magasins;
  if (ar) rows = rows.filter(m => m.animateur === ar);
  if (search) rows = rows.filter(m => String(m.libelle || '').toLowerCase().includes(search));
  return { rows, ar, search };
}

function todayCell(key, m, jourEnCours) {
  const v = m[key];
  const ok = (heure, title) => '<td class="c" title="' + escDash(title) + '"><span class="t-ok">✓</span>' + (heure ? '<span class="t-h">' + escDash(heure) + '</span>' : '') + '</td>';
  const gris = (txt, title) => '<td class="c" title="' + escDash(title || '') + '"><span class="t-gris">' + escDash(txt) + '</span></td>';
  const vide = '<td class="c"></td>';
  if (key === 'lancement') {
    if (v.statut === 'fait') return ok(v.heure, 'Lancement' + (v.heure ? ' — ' + v.heure : '') + (v.par ? ', ' + v.par : ''));
    if (v.statut === 'manquant') return '<td class="c"><span class="t-ko">✕</span><span class="t-h t-ko-txt">manquant</span></td>';
    if (v.statut === 'attendu') return gris(jourEnCours ? 'avant ' + todayData.butoir.replace(':', 'h') : '…', 'Attendu avant ' + todayData.butoir);
    return gris('—', 'Pas de lancement attendu (dimanche, férié ou fermeture réseau)');
  }
  if (key === 'pedlv') {
    if (!v) return gris('—', 'Aucun envoi PEDLV récent');
    if (v.fait) return ok(v.heure, 'PEDLV envoyé' + (v.heure ? ' — ' + v.heure : ''));
    return gris('il y a ' + v.joursDepuis + ' j', 'Dernier envoi PEDLV il y a ' + v.joursDepuis + ' jour(s)');
  }
  if (key === 'kaizen') {
    if (!v) return gris('—', 'Aucun audit Kaizen ouvert ce mois-ci');
    if (v.fait) return ok(v.heure, 'Kaizen — ' + v.nbItems + ' item(s) contrôlé(s)' + (v.par ? ', ' + v.par : ''));
    return gris((v.score != null ? v.score : 0) + '/' + (v.scoreMax || 50), 'Audit du mois en cours, rien de contrôlé ce jour');
  }
  if (!v && (key === 'bilan' || key === 'equipe')) {
    const j = key === 'bilan' ? m.bilanJours : m.equipeJours;
    const lib = key === 'bilan' ? ['Aucun bilan de passage enregistré', 'Dernier bilan de passage'] : ['Aucune évaluation équipe enregistrée', 'Dernière évaluation équipe'];
    if (j === null || j === undefined) return gris('—', lib[0]);
    return gris('il y a ' + j + ' j', lib[1] + ' il y a ' + j + ' jour' + (j > 1 ? 's' : ''));
  }
  if (!v) return vide;
  if (key === 'entretien') {
    const types = (v.types || []).map(t => SV_TYPES[t] || t).join(', ');
    return ok((v.nb > 1 ? v.nb + ' · ' : '') + (v.heure || ''), v.nb + ' entretien(s) : ' + types + (v.par ? ' — ' + v.par : ''));
  }
  if (key === 'bilan') return ok(v.heure, 'Bilan de passage' + (v.heure ? ' — ' + v.heure : '') + (v.par ? ', ' + v.par : ''));
  if (key === 'observation') return ok(v.nb > 1 ? v.nb + ' obs.' : v.heure, v.nb + ' observation(s)');
  if (key === 'equipe') return ok(v.heure, v.nb + ' contrôle(s) Évaluation équipe' + (v.par ? ' — ' + v.par : ''));
  return vide;
}

function renderTodayBody() {
  const d = todayData;
  if (!d) return;
  const { rows: base, ar } = todayFiltered();
  const sortSel = document.getElementById('today-sort').value;
  let rows = base.slice();
  if (sortSel === 'moins') rows.sort((a, b) => nbOutilsFaits(a) - nbOutilsFaits(b) || (b.lancement.statut === 'manquant') - (a.lancement.statut === 'manquant') || a.libelle.localeCompare(b.libelle, 'fr'));
  else if (sortSel === 'plus') rows.sort((a, b) => nbOutilsFaits(b) - nbOutilsFaits(a) || a.libelle.localeCompare(b.libelle, 'fr'));
  else rows.sort((a, b) => a.libelle.localeCompare(b.libelle, 'fr'));
  const jourEnCours = d.jour === d.today;

  // Compteurs (sur le périmètre filtré par AR, indépendamment de la recherche texte)
  const perim = ar ? d.magasins.filter(m => m.animateur === ar) : d.magasins;
  const actifs = perim.filter(magasinActif).length;
  const lancAttendus = perim.filter(m => m.lancement.statut !== 'non_attendu').length;
  const lancFaits = perim.filter(m => m.lancement.statut === 'fait').length;
  const lancManquants = perim.filter(m => m.lancement.statut === 'manquant').length;
  const nb = key => perim.filter(m => key === 'pedlv' || key === 'kaizen' ? (m[key] && m[key].fait) : !!m[key]).length;
  document.getElementById('today-kpis').innerHTML = `
    <div class="kpi-card"><p class="lbl">Magasins actifs</p><p class="val">${actifs}<span class="kpi-sub"> / ${perim.length}</span></p></div>
    <div class="kpi-card"><p class="lbl">Lancements</p><p class="val" style="color:${lancManquants ? 'var(--red)' : 'var(--green)'}">${lancFaits}<span class="kpi-sub"> / ${lancAttendus}</span></p></div>
    <div class="kpi-card"><p class="lbl">Bilans</p><p class="val">${nb('bilan')}</p></div>
    <div class="kpi-card"><p class="lbl">PEDLV</p><p class="val">${nb('pedlv')}</p></div>
    <div class="kpi-card"><p class="lbl">Kaizen</p><p class="val">${nb('kaizen')}</p></div>
    <div class="kpi-card"><p class="lbl">Entretiens</p><p class="val">${nb('entretien')}</p></div>
    <div class="kpi-card"><p class="lbl">Observations</p><p class="val">${nb('observation')}</p></div>
    <div class="kpi-card"><p class="lbl">Éval. équipe</p><p class="val">${nb('equipe')}</p></div>
  `;

  document.getElementById('today-body').innerHTML = rows.length ? rows.map(m => `
    <tr class="row-clickable${magasinActif(m) ? '' : ' t-inactif'}" onclick="showDetailView('${escDash(m.code)}')">
      <td><span class="t-mag">${escDash(m.libelle)}</span>${!ar && m.animateur ? '<span class="t-ar">' + escDash(m.animateur) + '</span>' : ''}</td>
      ${TODAY_OUTILS.map(o => todayCell(o.key, m, jourEnCours)).join('')}
    </tr>`).join('') : '<tr><td colspan="' + (TODAY_OUTILS.length + 1) + '" style="color:var(--gray)">Aucun magasin.</td></tr>';

  const codes = new Set(rows.map(m => m.code));
  const events = (d.events || []).filter(e => codes.has(e.code));
  document.getElementById('today-feed').innerHTML = events.length ? events.slice(0, 150).map(e => `
    <div class="feed-row">
      <span class="feed-h">${e.heure ? escDash(e.heure) : '—'}</span>
      <span class="feed-txt"><b>${escDash(e.libelle)}</b> · ${escDash(e.outil === 'entretien' ? 'Entretien ' + (SV_TYPES[e.detail] || e.detail || '') : e.detail || TODAY_OUTIL_LABELS[e.outil])}${e.par ? ' <span class="feed-par">— ' + escDash(e.par) + '</span>' : ''}</span>
    </div>`).join('') : '<p style="color:var(--gray);font-size:13px;margin:0">Rien de saisi pour le moment.</p>';
}

// ---------------------------------------------------------------- Boot
(function boot() {
  if (loadSession()) startApp();
})();
</script>
</body>
</html>
